<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Poppins is now self-hosted via @fontsource/poppins (see main.jsx),
         not loaded from Google's CDN - the old <link>-based approach here
         depended on the browser being able to reach fonts.googleapis.com /
         fonts.gstatic.com at runtime, which ad blockers and privacy
         extensions commonly block, silently falling back to the OS's
         default UI font with no visible error. Self-hosting removes that
         entire failure mode. -->
    <title>Roam</title>
    <meta name="description" content="Roam plans a real day by day trip in minutes: pick a city, dates, budget and interests, and every stop is a real place checked against Google." />
    <!-- Link preview for LinkedIn, iMessage, Slack and the rest. The image is
         1200x630, the size every one of them crops to, built from the Kyoto
         photo on the home screen. Absolute URLs on purpose: crawlers do not
         resolve relative ones (Akber, 10 Sep 2026). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roam" />
    <meta property="og:title" content="Roam: trip planning by AI, grounded in reality" />
    <meta property="og:description" content="Pick a city, dates, budget and interests. Roam plans a real day by day trip in minutes, every stop checked against Google." />
    <meta property="og:url" content="https://roam.akberahmed.com/" />
    <meta property="og:image" content="https://roam.akberahmed.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roam: trip planning by AI, grounded in reality" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roam: trip planning by AI, grounded in reality" />
    <meta name="twitter:description" content="Pick a city, dates, budget and interests. Roam plans a real day by day trip in minutes, every stop checked against Google." />
    <meta name="twitter:image" content="https://roam.akberahmed.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
